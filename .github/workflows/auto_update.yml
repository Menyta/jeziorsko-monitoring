name: Aktualizacja danych Jeziorsko

on:
  schedule:
    # Co godzinę, 5 minut po pełnej godzinie.
    - cron: "5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Uruchom Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pobierz dane IMGW
        run: python pobierz_dane.py

      - name: Sprawdź zmiany
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz dane do repozytorium
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dane.json
          git commit -m "Aktualizacja danych IMGW"
          git push
