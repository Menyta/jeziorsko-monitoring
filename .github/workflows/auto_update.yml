name: Aktualizacja danych Jeziorsko

on:
  schedule:
    # Co godzinę, 5 minut po pełnej godzinie.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v7

      - name: Ustaw Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Pobierz i przetwórz raport Wód Polskich
        run: python pobierz_dane.py

      - name: Sprawdź zmiany
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- dane.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Brak nowych danych."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dane zostały zmienione."
          fi

      - name: Zapisz dane do repozytorium
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane.json
          git commit -m "Aktualizacja danych Jeziorsko"
          git push
